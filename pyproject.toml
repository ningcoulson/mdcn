[project]
name = "mdcn"
version = "0.0.1"
description = "Modular crawler toolkit for Chinese original video metadata workflows"
requires-python = ">=3.11"
authors = [
  { name = "mdcn maintainers" }
]
dependencies = [
  "httpx>=0.27",
  "parsel>=1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
mdcn = "mdcn.app.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
